# ---------------------------------------------------------------
# PBA MVP — thresholds & physical assumptions (all adjustable)
# ---------------------------------------------------------------
scope:
  area: AREA1
  period_start: "2026-01-01"
  period_end: "2026-06-30"

bbt:
  design_minutes: 120          # BBT design (PROXY: no per-site field; matches source Good/Bad cut at ~120 min)
  ok_pct: 0.50                 # >= 50% of design  -> OK
  degraded_pct: 0.25           # 25%..50%          -> Degraded ; below -> Critical
  dead_max_minutes: 5          # <= 5 min backup   -> Dead (no effective backup)
  min_exhaustion_events: 1     # events needed to call BBT "measured"
  max_events_per_site_flag: 300  # above this in 6 months -> flagged as alarm flapping
  criteria_basis: standard     # standard = problem criteria vs the 120-min management design; site = vs per-site design (B1)
  design_by_class:             # fallback design BBT when battery design data is missing (PROXY)
    Diamond: 120
    Platinum: 120
    Gold: 120
    Silver: 120
    Bronze: 120
    Unknown: 120
  design_from_battery:         # per-site design BBT = banks x Ah/bank x usable DoD / NE load (A) x 60  (nominal V cancels: 48 V both sides)
    ah_per_bank:               # ASSUMED — the source files have no Ah field; set to the standard module per type
      LITHIUM: 100
      VRLA: 100
      MIXED: 100
      OTHER: 100
    usable_dod:
      LITHIUM: 0.90
      VRLA: 0.50
      MIXED: 0.70
      OTHER: 0.50
    min_minutes: 30
    max_minutes: 480
  derived_support:             # A4: a DERIVED (monthly summary) Dead/Critical BBT is trusted only with supporting evidence
    min_exhaustion_events: 2   #   >= this many battery-exhausted events, OR
    min_power_h: 1.0           #   power downtime >= this many hours AND
    min_share_of_pln: 0.5      #   power downtime >= this share of PLN outage hours (a near-zero battery turns outages into downtime)

battery_age_replace_years:     # age at which replacement is recommended
  VRLA: 4
  LITHIUM: 8
  OTHER: 5

load_high_ampere: 45           # NE load considered "high" (upgrade capacity instead of like-for-like)

mbp:
  same_nop_only: true          # coverage + candidates restricted to MBP's own NOP
  assignment_mode: history_then_nearest   # history_then_nearest | nearest
  max_radius_km: 120           # beyond this a site is "uncovered"
  rh_max_hours_per_ticket: 48  # RH meter diff above this = outlier

travel:                        # ESTIMATED travel-time model (Sumatera roads)
  road_factor: 1.35            # straight-line km -> road km
  mobilization_minutes: 15     # prepare + load MBP before departure
  speed_kmh:
    urban: 25                  # KOTA ... (city traffic)
    rural_short: 35            # rural, road km < 15 (village roads)
    rural_long: 45             # rural, road km >= 15 (provincial / national road)
  peak_hours: [7, 8, 16, 17, 18]   # local hour of departure
  peak_multiplier_urban: 1.4
  peak_multiplier_rural: 1.15
  night_hours: [22, 23, 0, 1, 2, 3, 4]
  night_multiplier: 1.2        # slower at night (visibility / safety)
  island_eta: unavailable      # island sites: no road ETA
  access_multiplier:           # road ETA multiplier by access class (PROXY classification, see Data quality)
    mainland: 1.0
    unknown: 1.0
    riverine_delta: 1.5        # river crossings / tidal roads (Banyuasin, OKI, Indragiri Hilir ...)
    remote: 2.0                # 'Kepulauan' flag outside known island / delta regencies
    island: 3.0                # indicative only (table display); simulation/feasibility treat islands as sea logistics

dependency_children:           # PROXY: HUB Site bucket -> children estimate (editable)
  end site: 0
  endsite: 0
  bts: 0
  repeater: 0
  simpul kecil: 2
  simpul: 3
  simpul sedang: 5
  combat: 1
  simpul besar: 8
  simpul sangat besar: 12
  bsc/simpul besar: 15
  backbone: 15
  bsc: 15
  controller: 15
  ttc: 15

power:
  max_pln_events_per_month: 200   # monthly 'Repetitive' above this = alarm flapping -> capped + flagged

site_condition:
  full_gap_pp: 3.0             # availability this many pp below target -> condition factor = 1

priority_levels:               # MBP priority score (0..1) -> P1..P4
  P1: 0.55
  P2: 0.42
  P3: 0.30

bbs_priority_levels:           # BBS priority score -> P1..P4 (only sites needing action are scored)
  P1: 0.63
  P2: 0.54
  P3: 0.45

action_batches:                # execution batches by priority
  P1: "Batch 1 — now (≤ 2 weeks)"
  P2: "Batch 2 — this month"
  P3: "Batch 3 — next PM cycle"
  P4: "Batch 4 — next quarter"

availability:
  dark_month_h: 8.0            # A2: a "dark month" = power-caused downtime >= this many wall-clock hours in that month
  dark_min_months: 2           #     a site is "dark" over the period with >= this many dark months (of 6)
  dark_quarter_min_months: 2   #     ... and "dark in a quarter" with >= this many dark months in that quarter
  trend_pp: 0.50               # A1: primary signal — availability change Q1 -> Q2 (pp)
  trend_dark_share_pp: 2.0     #     secondary signal — change in the share of dark sites (percentage points of cluster sites)
  min_cluster_sites: 5         # clusters with fewer sites -> Insufficient data

offair:                        # A5: suspected off-air / dismantled / data issue
  max_outage_share: 0.30       # total downtime >= 30% of the period
  full_month_share: 0.90       # or any month with downtime >= 90% of its hours
  no_alarm_min_share: 0.10     # or downtime >= 10% of the period with no battery alarms and no tickets
  exclude_by_default: true     # excluded from KPIs unless the header toggle is on

placement:                     # D1: fleet size & placement (ESTIMATED: straight-line x road factor)
  target_share: 0.90           # add MBPs until >= this share of MBP-P1/P2 sites is reached before BBT expires
  max_new: 15
  relocation_max_loss_pp: 0.5  # cumulative loss allowed for the whole relocation set (pp of MBP-P1/P2 reach)
  relocation_max_candidates: 3 # 3f: at most this many relocation candidates, tested cumulatively

severity_floor:                # escalation: measured Dead/Critical battery can never be below this priority
  measured_dead_critical: P2

basecamp_signal:               # under-served = at least `criteria_needed` of these are true
  criteria_needed: 2
  p1p2_sites_min: 15
  reach_risk_share_min: 0.30
  avg_eta_min: 60
  workload_quantile: 0.80      # deployments in H1 >= this quantile of all base camps
  overserved_max_p1p2: 2       # possibly over-served: low workload AND <= this P1/P2 AND avg ETA < 30 min

top15_weights:                 # Top 15 worst sites (each component is a 0–1 percentile rank, shown in the UI)
  availability_gap: 0.30
  power_downtime: 0.25
  bbt_risk: 0.20
  priority: 0.10
  recurrence: 0.10
  criticality: 0.05

worst_cluster_weights:
  share_dark: 0.30
  power_downtime_per_site: 0.25
  availability_gap: 0.30
  p1p2_dark_share: 0.15

unknown_handling:              # 3b: missing data is NOT zero
  neutral_rank: 0.5            # sites without PLN data (pln_source empty) / without MBP ticket history / without 2025 outage
                               # get this percentile rank in priority scores (median) and are flagged; the table shows "—"
